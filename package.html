<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PitroyTech</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <a class="back" href="index.html" id="back">←</a>
  <div id="lang" class="lang"></div>
  <div id="page"></div>

  <footer>
    <a href="https://github.com/pitroytech">github.com/pitroytech</a>
  </footer>

</div>

<script>
const escape = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Chọn ngôn ngữ một lần, dùng cho cả trang.
//
// Mọi trường hiển thị nay là {vi, en}. Một hàm đọc duy nhất, để không có chỗ
// nào quên rồi in ra `[object Object]` — thứ chỉ lộ ra trên máy người đọc.
const SCHEMA = 4;   // tăng khi ĐỔI hình dạng packages.json
const LANGS = ['en', 'vi'];

// Mặc định tiếng Anh, kể cả khi trình duyệt đặt tiếng Việt.
//
// Tweak này bán ra quốc tế, nên người lạ mở trang phải đọc được ngay; người
// Việt bấm một nút. Chọn theo `navigator.language` nghe có vẻ chu đáo hơn,
// nhưng nó khiến trang hiện hai thứ tiếng khác nhau cho hai người cùng đọc
// một link — và ảnh chụp trong bài giới thiệu sẽ không khớp trang họ thấy.
function pickLang() {
    const saved = localStorage.getItem('lang');
    return LANGS.includes(saved) ? saved : 'en';
}
let LANG = pickLang();
let TAB = 'info';
const t = (v) => (v && typeof v === 'object' && !Array.isArray(v)) ? (v[LANG] ?? v.en ?? '') : v;

// Nhãn cố định của trang. Song ngữ nửa vời — nội dung đổi mà khung không đổi —
// đọc khó hơn một ngữ, nên khung đi cùng nội dung.
const UI = {
    vi: { all: 'Tất cả gói', addSource: 'Thêm nguồn', copy: 'Sao chép',
          copied: 'Đã chép', manual: 'Chép tay', details: 'Chi tiết',
          kind: 'kho tweak', id: 'Mã gói', version: 'Phiên bản', section: 'Mục',
          compat: 'Tương thích', source: 'Nguồn',
          tabInfo: 'Chi tiết', tabLog: 'Nhật ký thay đổi',
          steps: ['Mở Sileo hoặc Zebra.',
                  'Sang mục Nguồn, bấm thêm, dán địa chỉ trên.',
                  'Tải gói bạn muốn.'],
          missing: 'Không có gói nào mang mã đó.',
          failed: 'Không đọc được danh sách gói.' },
    en: { all: 'All packages', addSource: 'Add the repo', copy: 'Copy',
          copied: 'Copied', manual: 'Select it', details: 'Details',
          kind: 'tweak repo', id: 'Identifier', version: 'Version', section: 'Section',
          compat: 'Compatibility', source: 'Links',
          tabInfo: 'Details', tabLog: 'Changelog',
          steps: ['Open Sileo or Zebra.',
                  'Go to Sources, add, and paste the address above.',
                  'Install the package you want.'],
          missing: 'No package with that identifier.',
          failed: 'Could not load the package list.' },
};
const u = (k) => UI[LANG][k];

function langSwitch(render) {
    const bar = document.getElementById('lang');
    if (!bar) return;
    bar.innerHTML = LANGS.map((l) =>
        `<button type="button" data-l="${l}"${l === LANG ? ' class="on"' : ''}>${l.toUpperCase()}</button>`
    ).join('');
    bar.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
        LANG = b.dataset.l;
        localStorage.setItem('lang', LANG);
        document.documentElement.lang = LANG;
        langSwitch(render);
        render();
    }));
    document.documentElement.lang = LANG;
}



const wanted = new URLSearchParams(location.search).get('id');
const page = document.getElementById('page');

fetch('packages.json?v=' + SCHEMA)
  .then((r) => r.json())
  .then((data) => {
    const p = data.packages.find((item) => item.id === wanted);
    if (!p) {
      // Hai tab: mô tả gói, và nhật ký từng bản.
    //
    // Nhật ký nằm cùng một file dữ liệu với mọi thứ khác, nên phát hành bản mới
    // là sửa đúng một chỗ. Chép tay sang trang riêng là cách chắc chắn để trang
    // và gói nói hai phiên bản khác nhau.
    const tabBar = `
      <div class="tabs">
        <button type="button" data-tab="info"${TAB === 'info' ? ' class="on"' : ''}>${escape(u('tabInfo'))}</button>
        <button type="button" data-tab="log"${TAB === 'log' ? ' class="on"' : ''}>${escape(u('tabLog'))}</button>
      </div>`;

    const details = `
      <section class="glass card body">
        ${t(p.description).map((line) => `<p>${escape(line)}</p>`).join('')}
      </section>

      <section class="glass card">
        <h3>${escape(u('details'))}</h3>
        <div class="meta">
          <div><span>${escape(u('id'))}</span><span>${escape(p.id)}</span></div>
          <div><span>${escape(u('version'))}</span><span>${escape(p.version)}</span></div>
          <div><span>${escape(u('section'))}</span><span>${escape(p.section)}</span></div>
          <div><span>${escape(u('compat'))}</span><span>${escape(t(p.compatibility))}</span></div>
        </div>
      </section>`;

    const changelog = `
      <section class="glass card body">
        ${(p.changelog || []).map((entry) => `
          <div class="release">
            <h4>${escape(entry.version)}<span>${escape(entry.date || '')}</span></h4>
            <ul>${t(entry.notes).map((n) => `<li>${escape(n)}</li>`).join('')}</ul>
          </div>`).join('') || `<p>${escape(u('failed'))}</p>`}
      </section>`;

    page.innerHTML = `<div class="glass card"><p>${escape(u('missing'))}</p></div>`;
      return;
    }
    document.title = p.name + ' — PitroyTech';
    const render = () => {
      document.getElementById('back').textContent = '← ' + u('all');

    // Nguồn, kèm icon GitHub vẽ thẳng bằng SVG.
    //
    // Không ảnh ngoài, không CDN: một icon tải từ nơi khác là một thứ nữa có
    // thể chết trong khi trang vẫn sống, và người đọc không biết vì sao.
    const GITHUB = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" '
      + 'fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 '
      + '7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13'
      + '-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07'
      + '-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82'
      + '.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82'
      + '1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46'
      + '.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>';

    const links = (p.links || []).map((l) => `
      <a class="srclink" href="${escape(l.url)}" target="_blank" rel="noopener">
        ${l.kind === 'github' ? GITHUB : ''}<span>${escape(l.label)}</span>
      </a>`).join('');
    const pro = `
      <section class="glass card">
        <h3>${escape(u('source'))}</h3>
        <div class="srclinks">${links}</div>
        ${p.availability ? `<p class="avail">${escape(t(p.availability))}</p>` : ''}
      </section>`;

    page.innerHTML = `
      <section class="glass card">
        <div class="pkg-top">
          <img class="glyph" src="${escape(p.icon)}" alt="" width="62" height="62">
          <span>
            <h2>${escape(p.name)}</h2>
            <p>${escape(t(p.tagline))}</p>
            <span class="badges">
              <span class="badge">${escape(t(p.price))}</span>
              <span class="badge plain">${escape(p.version)}</span>
            </span>
          </span>
        </div>
      </section>

      ${tabBar}
      ${TAB === 'log' ? changelog : details}
      ${pro}`;

    // Chuyển tab mà KHÔNG dựng lại cả trang từ đầu: `render()` gọi lại chính
    // nó, nên chỉ cần nhớ tab đang chọn rồi vẽ lại. Đổi ngôn ngữ cũng đi qua
    // `render()`, nên tab được giữ nguyên thay vì nhảy về đầu.
    page.querySelectorAll('.tabs button').forEach((b) =>
      b.addEventListener('click', () => { TAB = b.dataset.tab; render(); }));
    };
    langSwitch(render);
    render();
  })
  .catch(() => {
    page.innerHTML = `<div class="glass card"><p>${escape(u('failed'))}</p></div>`;
  });
</script>
</body>
</html>
