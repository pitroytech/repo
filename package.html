<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PitroyTech</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="CydiaIcon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="depiction">
<div class="wrap">

  <a class="back" href="index.html">← All packages</a>
  <div id="page"></div>

  <footer>
    <a href="https://github.com/pitroytech">github.com/pitroytech</a>
  </footer>

</div>

<script>
// Trang này chạy ở HAI nơi: trình duyệt, và bên trong Sileo.
//
// Sileo vẽ trang gói từ `SileoDepiction`, và khi URL đó trả HTML thì nó dựng
// một webview hẹp. Nên mọi thứ ở đây phải bọc chữ theo bề ngang máy và không
// dựa vào chỗ trống — không cột đôi, không chữ cố định pixel.
const SCHEMA = 8;
const escape = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const wanted = new URLSearchParams(location.search).get('id');
const page = document.getElementById('page');
let TAB = 'info';

fetch('packages.json?v=' + SCHEMA)
  .then((r) => r.json())
  .then((data) => {
    const p = data.packages.find((item) => item.id === wanted);
    if (!p) {
      page.innerHTML = '<div class="glass card"><p>No package with that identifier.</p></div>';
      return;
    }
    document.title = p.name + ' — PitroyTech';

    const render = () => {
      // Nguồn, kèm icon GitHub vẽ thẳng bằng SVG.
      //
      // Không ảnh ngoài, không CDN: một icon tải từ nơi khác là một thứ nữa có
      // thể chết trong khi trang vẫn sống, và người đọc không biết vì sao.
      const GITHUB = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" '
        + 'fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 '
        + '7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13'
        + '-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07'
        + '-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82'
        + '.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82'
        + '1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46'
        + '.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>';

      const links = (p.links || []).map((l) => `
        <a class="srclink" href="${escape(l.url)}" target="_blank" rel="noopener">
          ${l.kind === 'github' ? GITHUB : ''}<span>${escape(l.label)}</span>
        </a>`).join('');

      const details = `
        <section class="glass card body">
          ${p.description.map((line) => line.trimEnd().endsWith(':')
              ? `<h4>${escape(line)}</h4>`
              : `<p>${escape(line)}</p>`).join('')}
        </section>

        <section class="glass card">
          <h3>Details</h3>
          <div class="meta">
            <div><span>Identifier</span><span>${escape(p.id)}</span></div>
            <div><span>Version</span><span>${escape(p.version)}</span></div>
            <div><span>Section</span><span>${escape(p.section)}</span></div>
            <div><span>Compatibility</span><span>${escape(p.compatibility)}</span></div>
            ${p.older ? `<div><span>Also on the repo</span><span>${escape(p.older.version)}</span></div>` : ''}
          </div>
        </section>`;

      const changelog = `
        <section class="glass card body">
          ${(p.changelog || []).map((entry) => `
            <div class="release">
              <h4>${escape(entry.version)}<span>${escape(entry.date || '')}</span></h4>
              <ul>${entry.notes.map((n) => `<li>${escape(n)}</li>`).join('')}</ul>
            </div>`).join('') || '<p>No changelog yet.</p>'}
        </section>`;

      page.innerHTML = `
        <section class="glass card">
          <div class="pkg-top">
            <img class="glyph" src="${escape(p.icon)}" alt="" width="62" height="62">
            <span>
              <h2>${escape(p.name)}</h2>
              <p>${escape(p.tagline)}</p>
              <span class="badges">
                <span class="badge">${escape(p.price)}</span>
                <span class="badge plain">${escape(p.version)}</span>
              </span>
            </span>
          </div>
        </section>

        <div class="tabs">
          <button type="button" data-tab="info"${TAB === 'info' ? ' class="on"' : ''}>Details</button>
          <button type="button" data-tab="log"${TAB === 'log' ? ' class="on"' : ''}>Changelog</button>
        </div>
        ${TAB === 'log' ? changelog : details}

        ${p.older ? `<section class="glass card"><p class="avail">${escape(p.older.note)}</p></section>` : ''}

        <section class="glass card">
          <h3>Links</h3>
          <div class="srclinks">${links}</div>
          ${p.availability ? `<p class="avail">${escape(p.availability)}</p>` : ''}
        </section>`;

      // Đổi tab bằng cách vẽ lại: `render()` gọi lại chính nó, nên chỉ cần nhớ
      // tab đang chọn. Nút bị thay mới mỗi lượt nên phải gắn lại ở đây.
      page.querySelectorAll('.tabs button').forEach((b) =>
        b.addEventListener('click', () => { TAB = b.dataset.tab; render(); }));
    };

    render();
  })
  .catch(() => {
    page.innerHTML = '<div class="glass card"><p>Could not load the package list.</p></div>';
  });
</script>
</body>
</html>
