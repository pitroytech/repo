<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PitroyTech</title>
<meta name="description" content="Tweaks by PitroyTech.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="CydiaIcon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>PitroyTech</h1>
    <span class="by">tweak repo</span>
    <p class="lede"></p>
  </header>

  <section class="glass card">
    <h3>Add the repo</h3>
    <div class="sources">
      <a class="source-card" id="addsileo" href="#">
        <span class="source-mark">S</span>
        <span class="source-copy">
          <strong>Add to Sileo</strong>
          <span id="srcsileo"></span>
        </span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
      </a>
      <a class="source-card" id="addzebra" href="#">
        <span class="source-mark">Z</span>
        <span class="source-copy">
          <strong>Add to Zebra</strong>
          <span id="srczebra"></span>
        </span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
      </a>
    </div>
    <div class="source">
      <span id="src">https://pitroytech.github.io/repo/</span>
      <button class="copy" id="copy" type="button">Copy</button>
    </div>
  </section>

  <div id="list"></div>

  <footer>
    <a href="https://github.com/pitroytech">github.com/pitroytech</a>
  </footer>

</div>

<script>
// Một tệp dữ liệu, hai trang đọc chung.
//
// Trang chủ và trang chi tiết cùng đọc packages.json, nên thêm một gói là sửa
// một chỗ. Chép tay nội dung sang hai trang HTML là cách chắc chắn để hai nơi
// nói hai phiên bản khác nhau.
//
// Chỉ còn tiếng Anh. Bản song ngữ trước đây bắt mọi trường hiển thị phải là
// `{en, vi}` và mọi lượt đọc phải đi qua một hàm; đổi lại là một nút chuyển mà
// trang gói nhúng trong Sileo không ai bấm.
const SCHEMA = 8;   // tăng khi ĐỔI hình dạng packages.json
const escape = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

fetch('packages.json?v=' + SCHEMA)
  .then((r) => r.json())
  .then((data) => {
    const url = data.repo.url;
    document.querySelector('.lede').textContent = data.repo.description;
    document.getElementById('src').textContent = url;

    // Hai trình quản lý, hai lược đồ URL. Trang web không dò được máy có cài
    // cái nào, nên hiện cả hai — một nút xám vì đoán sai còn tệ hơn một nút
    // bấm không ăn.
    document.getElementById('addsileo').href = 'sileo://source/' + url;
    document.getElementById('addzebra').href = 'zbra://sources/add/' + url;
    const host = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
    document.getElementById('srcsileo').textContent = host;
    document.getElementById('srczebra').textContent = host;

    document.getElementById('list').innerHTML = data.packages.map((p) => `
      <a class="glass card pkg" href="package.html?id=${encodeURIComponent(p.id)}">
        <div class="pkg-top">
          <img class="glyph" src="${escape(p.icon)}" alt="" width="62" height="62">
          <span>
            <h2>${escape(p.name)}</h2>
            <p>${escape(p.tagline)}</p>
            <span class="badges">
              <span class="badge">${escape(p.price)}</span>
              <span class="badge plain">${escape(p.version)}</span>
              <span class="badge plain">${escape(p.section)}</span>
            </span>
          </span>
        </div>
      </a>`).join('');
  })
  .catch(() => {
    document.getElementById('list').innerHTML =
      '<div class="glass card"><p>Could not load the package list.</p></div>';
  });

document.getElementById('copy').addEventListener('click', async (event) => {
  const button = event.currentTarget;
  try {
    await navigator.clipboard.writeText(document.getElementById('src').textContent);
    button.textContent = 'Copied';
  } catch (error) {
    // Safari từ chối clipboard ở ngữ cảnh không an toàn. Bôi đen để người dùng
    // tự chép, thay vì một nút bấm không làm gì và không nói gì.
    const range = document.createRange();
    range.selectNodeContents(document.getElementById('src'));
    const selection = getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    button.textContent = 'Select it';
  }
  setTimeout(() => { button.textContent = 'Copy'; }, 2000);
});
</script>
</body>
</html>
