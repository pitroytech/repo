<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PitroyTech</title>
<meta name="description" content="Kho tweak miễn phí của PitroyTech.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>PitroyTech</h1>
    <span class="by" id="kind"></span>
    <p class="lede"></p>
    <div id="lang" class="lang"></div>
  </header>

  <section class="glass card">
    <h3 id="addsrc"></h3>
    <div class="source">
      <span id="src">https://pitroytech.github.io/repo/</span>
      <button class="copy" id="copy" type="button"></button>
    </div>
    <ol class="steps" id="steps"></ol>
  </section>

  <div id="list"></div>

  <footer>
    <a href="https://github.com/pitroytech">github.com/pitroytech</a>
  </footer>

</div>

<script>
// Một tệp dữ liệu, hai trang đọc chung.
//
// Trang chủ và trang chi tiết cùng đọc packages.json, nên thêm một gói là sửa
// một chỗ. Chép tay nội dung sang hai trang HTML là cách chắc chắn để hai nơi
// nói hai phiên bản khác nhau.
const escape = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Chọn ngôn ngữ một lần, dùng cho cả trang.
//
// Mọi trường hiển thị nay là {vi, en}. Một hàm đọc duy nhất, để không có chỗ
// nào quên rồi in ra `[object Object]` — thứ chỉ lộ ra trên máy người đọc.
const SCHEMA = 2;   // tăng khi ĐỔI hình dạng packages.json
const LANGS = ['en', 'vi'];

// Mặc định tiếng Anh, kể cả khi trình duyệt đặt tiếng Việt.
//
// Tweak này bán ra quốc tế, nên người lạ mở trang phải đọc được ngay; người
// Việt bấm một nút. Chọn theo `navigator.language` nghe có vẻ chu đáo hơn,
// nhưng nó khiến trang hiện hai thứ tiếng khác nhau cho hai người cùng đọc
// một link — và ảnh chụp trong bài giới thiệu sẽ không khớp trang họ thấy.
function pickLang() {
    const saved = localStorage.getItem('lang');
    return LANGS.includes(saved) ? saved : 'en';
}
let LANG = pickLang();
const t = (v) => (v && typeof v === 'object' && !Array.isArray(v)) ? (v[LANG] ?? v.en ?? '') : v;

// Nhãn cố định của trang. Song ngữ nửa vời — nội dung đổi mà khung không đổi —
// đọc khó hơn một ngữ, nên khung đi cùng nội dung.
const UI = {
    vi: { all: 'Tất cả gói', addSource: 'Thêm nguồn', copy: 'Sao chép',
          copied: 'Đã chép', manual: 'Chép tay', details: 'Chi tiết',
          kind: 'kho tweak', id: 'Mã gói', version: 'Phiên bản', section: 'Mục',
          compat: 'Tương thích', source: 'Nguồn',
          steps: ['Mở Sileo hoặc Zebra.',
                  'Sang mục Nguồn, bấm thêm, dán địa chỉ trên.',
                  'Tải gói bạn muốn.'],
          missing: 'Không có gói nào mang mã đó.',
          failed: 'Không đọc được danh sách gói.' },
    en: { all: 'All packages', addSource: 'Add the repo', copy: 'Copy',
          copied: 'Copied', manual: 'Select it', details: 'Details',
          kind: 'tweak repo', id: 'Identifier', version: 'Version', section: 'Section',
          compat: 'Compatibility', source: 'Links',
          steps: ['Open Sileo or Zebra.',
                  'Go to Sources, add, and paste the address above.',
                  'Install the package you want.'],
          missing: 'No package with that identifier.',
          failed: 'Could not load the package list.' },
};
const u = (k) => UI[LANG][k];

function langSwitch(render) {
    const bar = document.getElementById('lang');
    if (!bar) return;
    bar.innerHTML = LANGS.map((l) =>
        `<button type="button" data-l="${l}"${l === LANG ? ' class="on"' : ''}>${l.toUpperCase()}</button>`
    ).join('');
    bar.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
        LANG = b.dataset.l;
        localStorage.setItem('lang', LANG);
        document.documentElement.lang = LANG;
        langSwitch(render);
        render();
    }));
    document.documentElement.lang = LANG;
}


fetch('packages.json?v=' + SCHEMA)
  .then((r) => r.json())
  .then((data) => {
    document.getElementById('src').textContent = data.repo.url;
    const render = () => {
      document.querySelector('.lede').textContent = t(data.repo.description);
      document.getElementById('kind').textContent = u('kind');
      document.getElementById('addsrc').textContent = u('addSource');
      document.getElementById('copy').textContent = u('copy');
      document.getElementById('steps').innerHTML =
        u('steps').map((x) => `<li>${escape(x)}</li>`).join('');
      document.getElementById('list').innerHTML = data.packages.map((p) => `
      <a class="glass card pkg" href="package.html?id=${encodeURIComponent(p.id)}">
        <div class="pkg-top">
          <img class="glyph" src="${escape(p.icon)}" alt="" width="62" height="62">
          <span>
            <h2>${escape(p.name)}</h2>
            <p>${escape(t(p.tagline))}</p>
            <span class="badges">
              <span class="badge">${escape(t(p.price))}</span>
              <span class="badge plain">${escape(p.version)}</span>
              <span class="badge plain">${escape(p.section)}</span>
            </span>
          </span>
        </div>
      </a>`).join('');
    };
    langSwitch(render);
    render();
  })
  .catch(() => {
    document.getElementById('list').innerHTML =
      `<div class="glass card"><p>${escape(u('failed'))}</p></div>`;
  });

document.getElementById('copy').addEventListener('click', async (event) => {
  const button = event.currentTarget;
  const text = document.getElementById('src').textContent;
  try {
    await navigator.clipboard.writeText(text);
    button.textContent = u('copied');
  } catch (error) {
    // Safari từ chối clipboard ở ngữ cảnh không an toàn. Bôi đen để người
    // dùng tự chép, thay vì một nút bấm không làm gì và không nói gì.
    const range = document.createRange();
    range.selectNodeContents(document.getElementById('src'));
    const selection = getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    button.textContent = u('manual');
  }
  setTimeout(() => { button.textContent = u('copy'); }, 2000);
});
</script>
</body>
</html>
