# Dựng lại chỉ mục APT mỗi khi có .deb mới.
#
# Không dựng bằng tay: `Packages` phải khớp từng byte với file trong `debs/`,
# và một chỉ mục lệch thì Sileo báo "package not found" chứ không báo sai chỗ
# nào. Máy làm việc đếm byte, người làm việc quyết định.
name: Build repo index

on:
  push:
    paths:
      - "debs/**"
      - "CydiaIcon.png"
      - ".github/workflows/index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `apt-ftparchive` chứ không phải `dpkg-scanpackages`.
      #
      # `dpkg-scanpackages` chỉ chép ra những trường nó biết, nên nó **vứt**
      # `SileoDepiction` — trường duy nhất Sileo dùng để vẽ trang gói.
      # `apt-ftparchive` giữ nguyên mọi trường control, nên không cần chèn lại
      # bằng tay và không có chỗ nào để hai bên lệch nhau.
      - name: Install apt-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils xz-utils

      - name: Generate Packages
        run: |
          set -eu
          apt-ftparchive packages debs > Packages

          # Sileo đòi `Section:`. Thiếu nó thì gói không hiện trong danh sách và
          # không có thông báo nào nói vì sao.
          awk 'BEGIN{RS="";FS="\n"}
               {pkg="";sec="";
                for(i=1;i<=NF;i++){
                  if($i ~ /^Package: /) pkg=substr($i,10)
                  if($i ~ /^Section: /) sec=substr($i,10)}
                if(pkg!="" && sec==""){
                  printf "FAIL: %s thiếu Section, Sileo sẽ không hiện nó\n", pkg > "/dev/stderr"; exit 1}}' Packages

          # Viết đè `Description:` bằng nội dung trong `descriptions/`.
          #
          # Sileo hiện trường đó thô trên trang gói, mà nó nằm trong `.deb` —
          # sửa mấy dòng chữ lẽ ra phải build lại tweak và chờ mọi người cập
          # nhật. Chỉ mục thì dựng lại mỗi lần đẩy. Lý do đầy đủ trong script.
          python3 tools/rewrite-descriptions.py Packages
          gzip -9kf Packages
          bzip2 -9kf Packages
          xz -9e -kf Packages
          echo "--- chỉ mục ---"
          grep -c '^Package:' Packages
          grep -c '^SileoDepiction:' Packages || echo "0 SileoDepiction"

      # `Release` phải mang checksum của `Packages`.
      #
      # Bản cũ là một file tĩnh viết tay: chỉ có Origin/Label/Suite, **không có
      # khối MD5Sum/SHA256 nào**. Sileo đối chiếu checksum trong `Release` với
      # file tải về; không có thì nó từ chối nguồn. Zebra dễ tính hơn, nên suốt
      # nhiều bản "Zebra chạy, Sileo lỗi" — và đó là nguyên nhân thật, không
      # phải trường depiction.
      #
      # Sinh ở thư mục khác rồi chép vào để `Release` không tự băm chính nó.
      - name: Generate Release
        run: |
          set -eu
          mkdir -p .release-build
          cp Packages Packages.gz Packages.bz2 Packages.xz .release-build/
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="PitroyTech" \
            -o APT::FTPArchive::Release::Label="PitroyTech" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Version="1.0" \
            -o APT::FTPArchive::Release::Codename="ios" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm64 iphoneos-arm64e" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Tweaks by PitroyTech" \
            release .release-build > Release
          rm -rf .release-build
          echo "--- Release ---"
          cat Release

      - name: Commit index
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 Packages.xz Release
          git rm --cached --ignore-unmatch Packages.zst >/dev/null
          git diff --cached --quiet && echo "chỉ mục không đổi" && exit 0
          git commit -m "chore: rebuild package index"
          git push
